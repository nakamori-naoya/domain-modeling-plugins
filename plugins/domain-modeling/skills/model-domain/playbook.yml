# model-domain — domain-ruleの正式な定義から、クラス図と状態遷移図を主役にしたドメインモデル資料を1本保存する。
# 工程順と入出力、scriptが読む契約（contract）だけを持つ。判断規律はSKILL.mdとreferencesが持つ。
# 候補本文はagentがインメモリで保持し、検査scriptへは標準入力で渡す。索引はscriptが正式な定義のpathから毎回導く。
version: 2
name: model-domain
description: domain-ruleの正式な定義を1本受け取り、集約・エンティティ・値オブジェクト・ドメインイベントをクラス図に、状態とコマンドを状態遷移図に描き、図で表せない不変条件・コマンドの契約・何でないかだけを文章にしたドメインモデル資料を1本保存する
inputs: [domain_rule_path, user_input, references, existing_document_path, output_directory, name]

requires:
  - {plugin: grill, marketplace: grill}
  - {plugin: write-doc, marketplace: write-doc}

# scriptが読む契約。source.pyはsource_sections、verify.pyはそれ以外も読む。
# 候補本文の見出しの文言は契約に置かない。verify.pyは、write-docの公開契約がdomain-model型について宣言した目印だけを読む。
contract:
  # 正式な定義（domain-rule）から索引に拾う節。左が索引の役、右が正式な定義の見出し。
  source_sections:
    terms: 業務用語
    events: 業務イベント
    actions: 業務の行い
    concepts: 概念
    states: 状態と、その移り変わり
    bdd: BDD
  # 「業務の行い」の下で、コマンドを並べる小見出し。その下の各見出しがコマンドの名前になる。
  command_group: コマンド
  element_kinds: [集約ルート, エンティティ, 値オブジェクト, ドメインイベント]
  # コマンドを書けるのはこの種別だけ。
  command_holders: [集約ルート, エンティティ]
  # 複数の文脈で使う値に種別へ添える印。
  shared_mark: 文脈共有

steps:
  - id: index-source
    script: scripts/source.py
    purpose: 正式な定義から業務用語・業務イベント・コマンド・概念・状態・BDD番号を機械的に抜き出し、図に使ってよい語の索引として標準出力へ返す
    needs: [domain_rule_path]
    provides: [source_index]

  - id: settle
    playbook: grill
    purpose: 正式な定義と索引だけでは決まらない割り当て（集約の境界、集合への規則の守り手、状態の分け方、索引に無い語）のうち、図の形を変えるものを利用者へ確かめる
    needs: [domain_rule_path, user_input, references, source_index]
    provides: [decisions, open_questions]

  - id: assign
    agent_work: invoking_agent
    purpose: 同じagentが正式な定義、索引、決定、未決を一つの文脈で読み、クラス図と状態遷移図を先に描き、図で表せないことだけを文章にした本文をインメモリで作る
    needs: [domain_rule_path, source_index, decisions, open_questions]
    provides: [final_markdown]

  - id: verify
    script: scripts/verify.py
    purpose: 候補本文を標準入力で受け、図の語が索引にあること、種別とコマンドの置き場、状態遷移図の状態とコマンド、状態遷移図を含む節の拒む理由の見出し、引いたBDD番号を構造検査する
    needs: [domain_rule_path, final_markdown]
    provides: [validation_report]

  - id: document
    playbook: write-doc
    purpose: 同じagentが検査済み本文をkind:textのmaterialにし、更新ならexisting_document_pathだけ、新規ならoutput_directoryとnameだけを直接渡してdomain-model型の資料を1本保存する
    input:
      document_type: domain-model
    needs: [final_markdown, validation_report, references]
    conditional_needs:
      - when: existing_document_path
        needs: [existing_document_path]
      - when: not existing_document_path
        needs: [output_directory, name]
    provides: [domain_model_document_path]
