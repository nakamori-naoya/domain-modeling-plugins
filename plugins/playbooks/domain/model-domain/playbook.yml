# model-domain — domain-rule正本の業務概念を戦術DDDの要素へ割り当て、契約つきのドメインモデル資料を1本保存する。
#
# **この playbook は個々の手順を知らない。** 何を、どの順で呼ぶかだけを持つ。
# 外部packageへは公開playbookでだけ依存する。grillとwrite-docの
# 内部skill・工程id・保存モード名・script引数には触れない。
version: 2
name: model-domain
description: domain-rule正本を1本受け取り、業務概念を値オブジェクト・エンティティ・集約・ドメインイベントへ割り当て、各要素の目的・境界・不変条件・操作の契約を言語非依存で書いたドメインモデル資料を1本保存する
document_type: domain-model
output_format: markdown
instructions:
  execution:
    directive: stepsを上から順に実行し、needsを前工程のprovidesから受け取る。正本に無い語を要素にせず、検査を通るまで完成扱いにしない
  interaction:
    directive: 正本と索引から分かることを聞かず、正本だけでは決まらない割り当て（集約の境界、型の分割、正本に無い語の扱い）をgrillで1問ずつ確かめる

requires:
  - {plugin: grill, marketplace: grill}
  - {plugin: domain-model, marketplace: domain-modeling}
  - {plugin: write-doc, marketplace: write-doc}

# 下段どうしをつなぐ契約。playbook が持つ。
contract:
  # 正本（domain-rule）から索引に拾う節。左が索引の役、右が正本の見出し。
  source_sections:
    terms: 業務用語
    events: 業務イベント
    concepts: 概念
    invariants: 常に守られること
    states: 状態と、その移り変わり
    actors: 誰が行えるか
    rules: 業務ルール
    rejections: 拒むときの理由
    open_questions: まだ決まっていないこと
    bdd: BDD
  model_sections: [目的と範囲, 要素一覧, モデル図, 各要素の詳細, 集約の境界, 状態と型の分割, ドメインイベント, BDDとの対応, 捨てた割り当て, 未決, この資料に書かないもの]
  element_kinds: [値オブジェクト, エンティティ, 集約ルート, ドメインイベント, ドメインサービス]
  # ドメインサービスは既定では使わない。使った要素は検査が報告に出す。
  exceptional_kinds: [ドメインサービス]
  element_items: [目的, 何でないか, 持つもの, 不変条件, 生成の条件, 協働相手]
  operation_fields: [事前条件, 事後条件, 拒む理由, 発するイベント]
  collaboration_means: [識別子で参照, 値として渡す, ドメインイベント, 呼び手が両方を操作]
  forbidden_sections: [テーブル定義, 論理データモデル図, API, 画面, リポジトリ, 層構成]
  cleanup:
    delete_after_document: [grounded_input, source_index, candidate_model_path, verified_model_path, material]
    preserve: [domain_model_document_path]

requirements:
  input_grounded: true
  clarify_with_grill: true
  exclude_implementation: true

out_dir: domain-model

# stepsは上から実行する。needsは開始条件、providesは次工程へ渡す成果物。
# skillは自己完結した手順、scriptは決定的処理、playbookは入れ子の段取り。
steps:
  - id: settle
    playbook: grill
    purpose: 正本だけでは決まらない割り当て（集約の境界、状態ごとの型の分割、正本に無い語の扱い、未決の要素）を利用者へ1問ずつ確かめ、決定と未決を残す
    provides: [decisions, open_questions]

  - id: ground
    script: scripts/ground.py
    purpose: 依頼、正本のpath、確かめた決定と未決を、根拠づけられた入力として1つに束ねる
    needs: [decisions, open_questions]
    provides: [grounded_input]

  - id: index-source
    script: scripts/source.py
    purpose: 正本から業務用語・業務イベント・概念・常に守られること・状態・業務ルール・拒む理由・BDD番号・未決を機械的に抜き出し、割り当ての候補と検査の正解にする
    needs: [grounded_input]
    provides: [source_index]

  - id: assign
    skill: assign-domain-model
    purpose: 索引の語だけを要素にし、各要素の目的・何でないか・不変条件・操作の契約を書いた候補モデルを保存する
    needs: [grounded_input, source_index]
    provides: [candidate_model_path]

  - id: verify
    script: scripts/verify.py
    purpose: 節と順序、正本に無い要素名、要素ごとの必須項目、操作の契約、モデル図のクラスと要素の一致、BDDの対応の過不足を検査し、通った候補だけを返す
    needs: [candidate_model_path, source_index]
    provides: [verified_model_path]

  - id: assemble
    script: scripts/material.sh
    purpose: 検査済みモデル、正本のpath、決定と未決を1つの素材へ束ねる
    needs: [verified_model_path, grounded_input, source_index]
    provides: [material]

  - id: document
    playbook: write-doc
    purpose: 素材からdomain-model型の資料を1本書いて保存する
    input:
      document_type: ${.document_type}
    needs: [material]
    provides: [domain_model_document_path]

  - id: cleanup
    script: scripts/cleanup.py
    purpose: 最終資料の保存を確認した後、contract.cleanupで削除候補にした自分の作業用成果物だけを削除し、最終資料を保持する
    needs: [grounded_input, source_index, candidate_model_path, verified_model_path, material, domain_model_document_path]
    provides: [cleanup_report]
